modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}; upstream-derived dimension runtime: Apache-2.0"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"

description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.compat.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "exposure"
type = "required"
reason = "Dimensional Exposure's camera and viewfinder integration is verified with Exposure 1.9.19."
versionRange = "[1.9.19]"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sodium"
type = "optional"
reason = "Dimensional Exposure's optional Sodium integration requires Sodium 0.8.13 or newer."
versionRange = "[0.8.13,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "iris"
type = "optional"
reason = "Dimensional Exposure's optional Iris integration requires Iris 1.8.14 Beta 1 or newer."
versionRange = "[1.8.14-beta.1,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "immersive_portals_core"
type = "incompatible"
reason = "Dimensional Exposure includes its own dimension runtime and cannot be installed together with Immersive Portals. Remove Immersive Portals or Dimensional Exposure. "
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
